<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" width="100%" height="100%" style="background:#ffffff;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <!-- Border -->
  <rect x="20" y="20" width="760" height="1010" fill="#ffffff" stroke="#111827" stroke-width="3" rx="8"/>
  
  <!-- Header Section -->
  <line x1="20" y1="130" x2="780" y2="130" stroke="#111827" stroke-width="2.5"/>
  
  <!-- Logo & Title -->
  <circle cx="80" cy="75" r="38" fill="#14532d"/>
  <circle cx="80" cy="75" r="33" fill="#ffffff"/>
  <text x="80" y="82" font-size="20" font-weight="900" fill="#14532d" text-anchor="middle">AT</text>
  
  <text x="135" y="68" font-size="32" font-weight="900" fill="#047857" letter-spacing="0.5">ASIATECH</text>
  <text x="135" y="94" font-size="14" font-weight="700" fill="#1f2937">ASIA TECHNOLOGICAL SCHOOL OF SCIENCE AND ARTS</text>
  
  <!-- 2x2 Photo Box -->
  <rect x="655" y="38" width="80" height="80" fill="#ffffff" stroke="#991b1b" stroke-width="2" rx="4"/>
  <text x="695" y="83" font-size="12" font-weight="600" fill="#991b1b" text-anchor="middle">2x2 ID Photo</text>

  <!-- Title Banner -->
  <rect x="20" y="130" width="760" height="48" fill="#f1f5f9"/>
  <line x1="20" y1="178" x2="780" y2="178" stroke="#111827" stroke-width="2.5"/>
  <text x="400" y="161" font-size="18" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="1">ENROLLMENT PROCESS (NEW COLLEGE STUDENT)</text>

  <!-- Student Info -->
  <text x="45" y="215" font-size="14" font-weight="800" fill="#0f172a">NAME : </text>
  <line x1="110" y1="216" x2="420" y2="216" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>

  <text x="450" y="215" font-size="14" font-weight="800" fill="#0f172a">PROGRAM : </text>
  <line x1="545" y1="216" x2="755" y2="216" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>

  <text x="45" y="244" font-size="12" font-weight="600" fill="#dc2626" font-style="italic">Present this on each procedure.</text>

  <!-- Table Outer Box -->
  <rect x="45" y="260" width="710" height="660" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
  
  <!-- Table Header -->
  <rect x="45" y="260" width="710" height="42" fill="#f8fafc"/>
  <line x1="45" y1="302" x2="755" y2="302" stroke="#111827" stroke-width="2"/>
  <line x1="135" y1="260" x2="135" y2="920" stroke="#111827" stroke-width="2"/>
  <line x1="565" y1="260" x2="565" y2="920" stroke="#111827" stroke-width="2"/>
  
  <text x="90" y="287" font-size="13" font-weight="900" fill="#0f172a" text-anchor="middle">STEPS</text>
  <text x="350" y="287" font-size="13" font-weight="900" fill="#0f172a" text-anchor="middle">PROCEDURE</text>
  <text x="660" y="287" font-size="13" font-weight="900" fill="#0f172a" text-anchor="middle">APPROVED BY:</text>

  <!-- Step 1 -->
  <line x1="45" y1="390" x2="755" y2="390" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="90" y="352" font-size="18" font-weight="800" fill="#0f172a" text-anchor="middle">1</text>
  <text x="350" y="340" font-size="15" font-weight="900" fill="#0f172a" text-anchor="middle">INQUIRY</text>
  <text x="350" y="364" font-size="13" font-weight="800" fill="#b91c1c" text-anchor="middle">INFORMATION OFFICE</text>

  <!-- Step 2 -->
  <line x1="45" y1="478" x2="755" y2="478" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="90" y="440" font-size="18" font-weight="800" fill="#0f172a" text-anchor="middle">2</text>
  <text x="350" y="426" font-size="15" font-weight="900" fill="#0f172a" text-anchor="middle">REGISTRATION &amp; REQUIREMENTS</text>
  <text x="350" y="450" font-size="13" font-weight="800" fill="#b91c1c" text-anchor="middle">ADMISSION OFFICE</text>

  <!-- Step 3 -->
  <line x1="45" y1="566" x2="755" y2="566" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="90" y="528" font-size="18" font-weight="800" fill="#0f172a" text-anchor="middle">3</text>
  <text x="350" y="516" font-size="15" font-weight="900" fill="#0f172a" text-anchor="middle">ENLISTMENT</text>
  <text x="350" y="540" font-size="13" font-weight="800" fill="#b91c1c" text-anchor="middle">REGISTRAR'S OFFICE</text>

  <!-- Step 4 -->
  <line x1="45" y1="654" x2="755" y2="654" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="90" y="616" font-size="18" font-weight="800" fill="#0f172a" text-anchor="middle">4</text>
  <text x="350" y="604" font-size="15" font-weight="900" fill="#0f172a" text-anchor="middle">PAYMENT/S &amp; ACCOUNTS</text>
  <text x="350" y="628" font-size="13" font-weight="800" fill="#b91c1c" text-anchor="middle">ACCOUNTING OFFICE</text>

  <!-- Step 5 -->
  <line x1="45" y1="742" x2="755" y2="742" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="90" y="704" font-size="18" font-weight="800" fill="#0f172a" text-anchor="middle">5</text>
  <text x="350" y="692" font-size="15" font-weight="900" fill="#0f172a" text-anchor="middle">ISSUANCE OF ID &amp; SCHOOL EMAIL</text>
  <text x="350" y="716" font-size="13" font-weight="800" fill="#b91c1c" text-anchor="middle">IT DEPARTMENT</text>

  <!-- Step 6 -->
  <line x1="45" y1="830" x2="755" y2="830" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="90" y="792" font-size="18" font-weight="800" fill="#0f172a" text-anchor="middle">6</text>
  <text x="350" y="780" font-size="15" font-weight="900" fill="#0f172a" text-anchor="middle">PROFILING &amp; SSC FEE</text>
  <text x="350" y="804" font-size="13" font-weight="800" fill="#b91c1c" text-anchor="middle">OSA / GUIDANCE &amp; SSC</text>

  <!-- Step 7 -->
  <text x="90" y="880" font-size="18" font-weight="800" fill="#0f172a" text-anchor="middle">7</text>
  <text x="350" y="880" font-size="16" font-weight="900" fill="#047857" text-anchor="middle">OFFICIALLY ENROLLED!</text>
  <rect x="595" y="858" width="130" height="36" fill="#ecfdf5" stroke="#047857" stroke-width="1.5" rx="4"/>
  <text x="660" y="881" font-size="12" font-weight="900" fill="#065f46" text-anchor="middle">ASIATECH</text>

  <!-- Footer Signature & Date -->
  <line x1="120" y1="985" x2="380" y2="985" stroke="#111827" stroke-width="1.5"/>
  <text x="250" y="1005" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Student's Signature</text>

  <line x1="520" y1="985" x2="680" y2="985" stroke="#111827" stroke-width="1.5"/>
  <text x="600" y="1005" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Date</text>
</svg>
